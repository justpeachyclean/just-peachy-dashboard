<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <!-- Peach fruit outline -->
  <g transform="translate(320, 72)">
    <!-- Peach body -->
    <circle cx="0" cy="8" r="52" fill="none" stroke="#E8B4A0" stroke-width="3.5"/>
    <!-- Crease at bottom -->
    <path d="M0 55 Q-4 45 0 36 Q4 45 0 55" fill="none" stroke="#E8B4A0" stroke-width="2.5"/>
    <!-- Leaves -->
    <path d="M8 -42 Q28 -62 48 -55 Q32 -38 8 -42Z" fill="#6B7A2A" opacity="0.9"/>
    <path d="M18 -46 Q42 -70 58 -58 Q44 -38 18 -46Z" fill="#8A9E35" opacity="0.8"/>
    <!-- Stem -->
    <line x1="8" y1="-44" x2="12" y2="-30" stroke="#6B7A2A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- "just" text - script style -->
  <text x="12" y="82"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="68"
    font-weight="700"
    fill="#7D1A2B"
    letter-spacing="-1">just</text>

  <!-- "peachy" text - script style -->
  <text x="8" y="148"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="72"
    font-weight="700"
    fill="#7D1A2B"
    letter-spacing="-1">peachy</text>

  <!-- "CLEAN, LLC" text -->
  <text x="14" y="172"
    font-family="'Arial', sans-serif"
    font-size="22"
    font-weight="400"
    fill="#6B7A2A"
    letter-spacing="6">CLEAN, LLC</text>
</svg>
